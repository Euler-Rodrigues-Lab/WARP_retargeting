[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warp-retargeting"
version = "0.1.0"
description = "Frozen WARP paper reproducibility and retargeting experiment tooling"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kczttm" }]
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]
runtime = ["rby1-teleop", "eurola-geo-kin-core[fallback]==0.1.2", "h5py>=3.11", "eurola-xrt-devices[recording]==0.1.2"]
policy = ["websockets>=14", "msgpack-numpy>=0.4.8"]

[project.scripts]
warp-validate-offline = "warp_retargeting.offline_validate:main"
warp-replay-hdf5 = "warp_retargeting.replay_hdf5:main"
warp-rollout-policy = "warp_retargeting.policy_rollout:main"
warp-transcode-csv = "warp_retargeting.transcode_csv:main"
warp-metrics = "warp_retargeting.metrics:main"
warp-build-dataset = "warp_retargeting.build_dataset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
rby1-teleop = { path = "external/rby1_teleop", editable = true }


[tool.geo-kin]
product = "rby1-xhand"

[tool.pytest.ini_options]
testpaths = ["tests"]
