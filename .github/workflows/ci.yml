name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python scripts/check_repository_scope.py
      - run: python -m pip install 'geo-kin-core[fallback] @ git+https://github.com/Euler-Rodrigues-Lab/geo_kin_core.git'
      - run: python -m pip install -e external/rby1_teleop
      - run: python -m pip install -e '.[test,runtime]'
      - run: pytest
