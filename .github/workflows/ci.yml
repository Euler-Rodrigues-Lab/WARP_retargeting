name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.10"
      - run: uv sync --locked --extra runtime --extra test
      - run: uv run python scripts/check_repository_scope.py
      - run: uv run pytest
      - run: uv run warp-replay-hdf5 fixtures/retargeted/washing_dishes_warp.hdf5 --headless --max-frames 120
