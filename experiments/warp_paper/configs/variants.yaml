# Frozen paper-method variants. This file must not absorb post-submission work.
defaults:
  data:
    csv_reading_freq: 30.0
    no_filter: false
    no_aria_black_image: false
    task_id: null
  video:
    no_video: false
    per_demo_video: false
  enable_base_motion: true

variants:
  ours:
    solver: sew
    description: "WARP: SEW + functional retargeting + functional offset + joint limits + spring-damper base"
    sew:
      enable_collision_avoidance: false
      enable_stability_clamp: false
      enable_functional_retargeting: true
      enable_functional_offset: true
      enable_joint_limits: true
      mobile_base_spring_damper: true
      mobile_base_deadband: 0.05
      mobile_base_yaw_deadband: 0.1
      mobile_base_natural_freq: 1.5
      mobile_base_damping_ratio: 1.0
      mobile_base_adaptive_freq: false
      mobile_base_freq_min: 0.3
      mobile_base_adaptive_threshold: 0.15
  c_sew:
    solver: sew
    description: "Compositional SEW baseline: WARP without functional offset"
    sew:
      enable_collision_avoidance: false
      enable_stability_clamp: false
      enable_functional_retargeting: true
      enable_functional_offset: false
      enable_joint_limits: true
      mobile_base_spring_damper: true
  ours_no_spring:
    solver: sew
    description: "WARP without spring-damper base"
    sew:
      enable_collision_avoidance: false
      enable_stability_clamp: false
      enable_functional_retargeting: true
      enable_functional_offset: true
      enable_joint_limits: true
      mobile_base_spring_damper: false
  sew_mimic:
    solver: sew
    description: "Pure SEW baseline"
    sew:
      enable_collision_avoidance: false
      enable_stability_clamp: false
      enable_functional_retargeting: false
      enable_functional_offset: false
      enable_joint_limits: true
      mobile_base_spring_damper: false
